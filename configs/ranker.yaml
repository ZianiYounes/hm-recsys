k: 12

# Retrievers neuronaux utilises comme sources de candidats (un fichier configs/<nom>.yaml
# chacun). Apres la Phase 3 : [two_tower, sasrec]
retrievers: [two_tower]

# Similarite FashionCLIP client x article (Phase 3, necessite data/embeddings/)
use_clip_features: false

# Semaines d'entrainement du ranker, relatives a la semaine evaluee.
# val (semaine 1) + [1, 2] -> entraine sur les semaines 2 et 3.
train_week_offsets: [1, 2]

# Candidats gardes par source et par client (avant union et deduplication)
candidates:
  rep: 50
  two_tower: 100
  sasrec: 100
  co: 50
  pop: 30

lgbm:
  objective: lambdarank
  metric: map
  eval_at: [12]
  n_estimators: 200
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 100
  colsample_bytree: 0.8
  subsample: 0.8
  subsample_freq: 1
  lambdarank_truncation_level: 20
  random_state: 42
  n_jobs: -1
  verbose: -1
